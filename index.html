function onTyping(v){const text=Array.from(getText());const chars=Array.from(v).slice(0,text.length);state.typed=chars.join('');if(chars.length)startTimer();const field=$('#typing-field');if(field){field.value=state.typed;field.focus()}const area=$('#type-area');if(area)area.innerHTML=text.map((ch,i)=>`<span class="${i<chars.length?(chars[i]===ch?'right':'wrong'):i===chars.length?'cursor':''}">${escapeHTML(ch)}</span>`).join('');const m=compute();if($('#accuracy'))$('#accuracy').textContent=chars.length?m.accuracy+'%':'–';if($('#typed-count'))$('#typed-count').textContent=chars.length+' / '+text.length+' ตัวอักษร';refreshPractice();if(chars.length===text.length)finish(false)}
function finish(early){if(!state.typed.length){toast('เริ่มพิมพ์ก่อนจึงจะสรุปผลได้');return}if(state.start)state.elapsed=Math.max(1,Math.floor((Date.now()-state.start)/1000));stopTimer();const m=compute();state.last={id:state.lessonId,name:state.testMode?'ทดสอบความเร็ว':getLesson().name,level:getLesson().level,mode:state.testMode?'test':'lesson',date:new Date().toISOString(),seconds:Math.max(1,state.elapsed),typed:state.typed.length,total:Array.from(getText()).length,early,...m};state.results.push(state.last);if(!early&&!state.testMode&&m.accuracy>=95){const idx=allLessons.findIndex(l=>l.id===state.lessonId);if(idx<allLessons.length-1)state.lessonId=allLessons[idx+1].id}save();view('results')}
function results(){const r=state.last||state.results.at(-1);if(!r)return `<h1 class="title">ผลการฝึก</h1><div class="card empty">ยังไม่มีผลการฝึก <br><br><button class="btn" onclick="view('path')">เลือกบทเรียน</button></div>`;let good=r.accuracy>=95&&!r.early;return `<div class="results-head"><div class="trophy">${good?'🏆':'🌱'}</div><span class="badge ${good?'success':''}">${good?'ผ่านบทเรียน':'ฝึกต่อได้อีก'}</span><h2>${good?'ทำได้ดีมาก!':'ทุกครั้งที่ฝึกคือความก้าวหน้า'}</h2><p class="muted">${escapeHTML(r.name)} · ${new Date(r.date).toLocaleDateString('th-TH',{dateStyle:'medium'})}</p></div><div class="grid four">${[['⚡',r.wpm,'WPM'],['◎',r.accuracy+'%','ความแม่นยำ'],['◷',clock(r.seconds),'เวลาฝึก'],['⌨',r.errors,'ตัวอักษรที่ผิด']].map(x=>`<div class="card result-value"><div style="font-size:22px">${x[0]}</div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="grid two" style="margin-top:18px"><div class="card"><h3>สรุปการพิมพ์</h3><table class="stat-table"><tr><td>ความเร็ว</td><td>${r.wpm} WPM</td></tr><tr><td>อักขระต่อนาที</td><td>${r.cpm} CPM</td></tr><tr><td>พิมพ์แล้ว</td><td>${r.typed} / ${r.total} ตัวอักษร</td></tr><tr><td>พิมพ์ถูก</td><td>${r.typed-r.errors}</td></tr><tr><td>พิมพ์ผิด</td><td>${r.errors}</td></tr></table></div><div class="card"><h3>คำแนะนำสำหรับคุณ</h3><p class="muted" style="line-height:2">${r.accuracy>=95?'ความแม่นยำดีมาก ลองเพิ่มความเร็วทีละน้อยโดยรักษาความถูกต้องไว้':'ลองพิมพ์ช้าลงเล็กน้อยและดูรูปมือช่วยแนะนำตำแหน่งนิ้ว เพื่อให้ความแม่นยำถึง 95% ก่อน'}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:25px"><button class="btn outline" onclick="begin('${r.id}',${r.mode==='test'})">↻ ฝึกอีกครั้ง</button><button class="btn" onclick="${r.mode==='test'?"view('stats')":"view('path')"}">${r.mode==='test'?'ดูสถิติ':'บทเรียนถัดไป'} →</button></div></div></div>`}
function stats(){const data=state.range===0?state.results:state.results.filter(r=>new Date(r.date).getTime()>=Date.now()-state.range*86400000);return `<div class="label-row"><div><h1 class="title">สถิติของฉัน</h1><p class="lead">ดูพัฒนาการความเร็วและความแม่นยำของคุณ</p></div><select class="typing-field" style="width:auto" onchange="state.range=Number(this.value);render()"><option value="7" ${state.range===7?'selected':''}>7 วัน</option><option value="30" ${state.range===30?'selected':''}>30 วัน</option><option value="0" ${state.range===0?'selected':''}>ทั้งหมด</option></select></div><div class="grid three">${metric('⚡',average(data.map(r=>r.wpm))+' WPM','ความเร็วเฉลี่ย')}${metric('◎',(data.length?average(data.map(r=>r.accuracy)):'–')+'%','ความแม่นยำเฉลี่ย')}${metric('◷',Math.round(data.reduce((s,r)=>s+r.seconds,0)/60)+' นาที','เวลาฝึกทั้งหมด')}</div><div class="section-head"><h3>กราฟความเร็วในการพิมพ์</h3><span class="muted">${data.length} ครั้งที่ฝึก</span></div><div class="card">${data.length?bars(data.slice(-10).map((r,i)=>({name:state.range===7?new Date(r.date).toLocaleDateString('th-TH',{day:'numeric',month:'numeric'}):String(i+1),v:r.wpm}))):'<div class="empty">ยังไม่มีข้อมูล เริ่มฝึกบทแรกเพื่อสร้างกราฟของคุณ</div>'}</div><div class="section-head"><h3>ประวัติการฝึก</h3></div><div class="card" style="overflow:auto">${data.length?`<table class="stat-table"><thead><tr><th>วันที่</th><th>บทเรียน</th><th>WPM</th><th>Accuracy</th><th>เวลา</th></tr></thead><tbody>${data.slice().reverse().slice(0,30).map(r=>`<tr><td>${new Date(r.date).toLocaleDateString('th-TH')}</td><td>${escapeHTML(r.name)}</td><td>${r.wpm}</td><td>${r.accuracy}%</td><td>${clock(r.seconds)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">ยังไม่มีประวัติการฝึก</div>'}</div>`}
function render(){const html=state.page==='dashboard'?dashboard():state.page==='path'?path():state.page==='practice'?practice():state.page==='results'?results():stats();$('#app').innerHTML=shell(html);if(state.page==='practice'){const field=$('#typing-field');field.addEventListener('input',e=>onTyping(e.target.value));field.addEventListener('keydown',e=>{if(e.code==='Tab'){e.preventDefault();return}if(e.code==='ShiftLeft'||e.code==='ShiftRight')state.shiftSide=e.code==='ShiftLeft'?'left':'right'});field.focus()}}
let toastTimeout;function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.remove(),2500)};
render();
</script></body></html>
